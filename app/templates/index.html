<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение цен</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="bg-dark text-light">

<!-- Header -->
<header class="bg-dark border-bottom border-secondary py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1 class="h2 mb-0 text-primary">🛒 Price comparer</h1>
                <p class="text-muted mb-0">Найдите лучшие предложения на маркетплейсах</p>
            </div>
            <div class="col-md-6">
                <div class="input-group input-group-lg">
                    <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary"
                           placeholder="Введите название товара...">
                    <button id="searchBtn" class="btn btn-outline-primary">
                        <span class="icon search-icon">🔍</span>
                        <span class="icon loader-icon spinner-border spinner-border-sm" style="display:none;"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Market Filter -->
        <div class="row mt-3">
            <div class="col-12">
                <div class="btn-group" role="group">
                    <button type="button" data-market="all" class="btn btn-outline-primary active">Все площадки</button>
                    <button type="button" data-market="wb" class="btn btn-outline-primary">Wildberries</button>
                    <button type="button" data-market="ozon" class="btn btn-outline-primary">Ozon</button>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Controls -->
<section class="container mb-4">
    <div class="row">
        <div class="col-md-6">
            <label class="form-label fw-bold text-light">Сортировка:</label>
            <select id="sortSelect" class="form-select bg-dark text-light border-secondary">
                <option value="price_asc">Цена по возрастанию</option>
                <option value="price_desc">Цена по убыванию</option>
                <option value="rating_desc">Высокий рейтинг</option>
                <option value="reviews_desc">Много отзывов</option>
            </select>
        </div>
        <div class="col-md-6 d-flex align-items-end">
            <div class="text-muted" id="resultsCount"></div>
        </div>
    </div>
</section>

<!-- Results -->
<main class="container">
    <div id="results" class="row g-3"></div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-5" style="display: none;">
        <div class="empty-icon mb-3">🔍</div>
        <h3 class="text-muted">Начните поиск товаров</h3>
        <p class="text-muted">Введите название товара в поисковую строку выше</p>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/script.js"></script>
</body>
</html>
